<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver Login — Christiana Pick Up JA</title><link rel="stylesheet" href="style.css"></head><body><main class="auth"><div class="card"><div class="brand">CHRISTIANA <span>PICK UP JA</span></div><h1>Driver Login</h1><p class="muted">Private driver dashboard.</p><form id="login"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>LOGIN</button><div id="msg" class="result"></div></form></div></main><script>login.onsubmit=async e=>{e.preventDefault();msg.textContent='Signing in…';let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});let j=await r.json();if(!r.ok){msg.textContent='❌ '+j.error;return}localStorage.cpjaToken=j.token;location='/dashboard.html'}</script></body></html>
