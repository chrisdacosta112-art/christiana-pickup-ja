<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver Dashboard</title><link rel="stylesheet" href="style.css"></head><body class="dash"><header><div class="brand">CHRISTIANA <span>PICK UP JA</span></div><div><span id="live">● LIVE</span> <button class="small" onclick="logout()">LOG OUT</button></div></header><main class="dashboard"><div class="dashhead"><div><p class="eyebrow">DRIVER DASHBOARD</p><h1>Incoming bookings</h1><p class="muted">New requests refresh automatically.</p></div><div class="stats"><div><b id="newCount">0</b><span>NEW</span></div><div><b id="activeCount">0</b><span>ACTIVE</span></div><div><b id="completedCount">0</b><span>DONE</span></div></div></div><div class="filters"><button onclick="filter='all';load()">ALL</button><button onclick="filter='NEW';load()">NEW</button><button onclick="filter='ACCEPTED';load()">ACCEPTED</button><button onclick="filter='EN_ROUTE';load()">EN ROUTE</button><button onclick="filter='COMPLETED';load()">COMPLETED</button></div><div id="bookings" class="bookings"></div></main><script>let token=localStorage.cpjaToken,filter='all',lastMax=0,first=true;if(!token)location='/login.html';const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};let r=await fetch(url,opt);if(r.status===401){logout();throw Error('Login expired')}return r.json()}function card(b){let s=b.status;return `<article class="booking ${s.toLowerCase()}"><div class="bookingtop"><div><span class="badge">${esc(s)}</span><span class="id">#${b.id}</span></div><time>${esc(b.ride_date)} • ${esc(b.ride_time)}</time></div><h2>${esc(b.name)}</h2><div class="route"><div><small>PICKUP</small><strong>📍 ${esc(b.pickup)}</strong></div><div class="arrow">→</div><div><small>DESTINATION</small><strong>📍 ${esc(b.destination)}</strong></div></div><div class="details"><span>🚗 ${esc(b.service)}</span><span>👥 ${esc(b.passengers)}</span><a href="tel:${esc(b.phone)}">📞 ${esc(b.phone)}</a></div><div class="fare">Fare: <input id="price-${b.id}" value="${esc(b.price||'Quote on booking')}"></div>${b.notes?`<p class="notes">📝 ${esc(b.notes)}</p>`:''}<div class="actions">${s==='NEW'?`<button onclick="update(${b.id},'ACCEPTED')">✓ ACCEPT</button><button class="danger" onclick="update(${b.id},'CANCELLED')">CANCEL</button>`:''}${s==='ACCEPTED'?`<button onclick="update(${b.id},'EN_ROUTE')">🚗 EN ROUTE</button><a class="callbtn" href="tel:${esc(b.phone)}">CALL</a>`:''}${s==='EN_ROUTE'?`<button onclick="update(${b.id},'ARRIVED')">📍 ARRIVED</button>`:''}${s==='ARRIVED'?`<button onclick="update(${b.id},'COMPLETED')">✓ COMPLETED</button>`:''}${s==='COMPLETED'?`<span class="done">Trip completed</span>`:''}</div></article>`}async function load(){let rows=await api('/api/bookings?status='+filter);let all=filter==='all'?rows:await api('/api/bookings');let newest=all.length?Math.max(...all.map(x=>x.id)):0;if(!first&&newest>lastMax){document.title='🔔 New Booking — Driver Dashboard';setTimeout(()=>document.title='Driver Dashboard',4000);try{if(navigator.vibrate)navigator.vibrate([300,150,300])}catch(e){}}first=false;lastMax=newest;$('newCount').textContent=all.filter(x=>x.status==='NEW').length;$('activeCount').textContent=all.filter(x=>['ACCEPTED','EN_ROUTE','ARRIVED'].includes(x.status)).length;$('completedCount').textContent=all.filter(x=>x.status==='COMPLETED').length;$('bookings').innerHTML=rows.length?rows.map(card).join(''):`<div class="empty">No bookings in this view.</div>`}async function update(id,status){let price=document.getElementById('price-'+id)?.value;await api('/api/bookings/'+id,{method:'PATCH',body:JSON.stringify({status,price})});load()}function logout(){localStorage.removeItem('cpjaToken');location='/login.html'}load();setInterval(load,5000)</script></body></html>
